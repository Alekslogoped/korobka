<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подарки для друзей</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#e4edf6;font-family:Arial,sans-serif;color:#243b66;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #304ea5;outline-offset:5px}
#frame{position:relative;overflow:hidden;border-radius:24px;box-shadow:0 12px 45px #233b6630}
#game{position:absolute;width:1280px;height:720px;transform-origin:top left;overflow:hidden;background:#e8f5df url("assets/festive-meadow-v1.webp") center/cover no-repeat}

.header{position:absolute;inset:16px 26px auto;display:flex;align-items:center;gap:20px;background:#ffffffe6;border:1px solid white;border-radius:20px;padding:12px 16px}
h1{font-size:31px;margin:0;flex:1}
.levels{display:flex;gap:9px}
.dot{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:#ffffffc9;font-weight:bold;border:2px solid #abc2df}
.dot.active{background:#4566af;color:white;border-color:#4566af}
.dot.done{background:#d5ebba;border-color:#80ab59}
.control{border:2px solid #c4d1e5;background:white;border-radius:16px;padding:12px 17px;font-size:19px;font-weight:bold;box-shadow:0 4px #c4d1e5}
.guest{position:absolute;left:17px;top:108px;width:338px;height:420px;text-align:center}
.child{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:normal;margin:0}
.child img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}




.guest-name{position:absolute;left:50%;bottom:-50px;transform:translateX(-50%);font-size:27px;font-weight:bold;line-height:1.1;background:#fffef2ef;border:2px solid white;border-radius:16px;padding:6px 24px}
#instruction{min-height:80px;padding:14px 16px;background:#ffffffdf;border:2px solid white;border-radius:20px;font-size:22px;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center}
.table{position:absolute;left:378px;top:280px;width:856px;height:286px}
.table-art{position:absolute;left:0;top:0;width:100%;height:auto;display:block;z-index:1;pointer-events:none;user-select:none}
.slots{position:absolute;left:38px;right:38px;top:-72px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;z-index:2}
.slot{height:157px;position:relative;background:#ffffff69;border:3px dashed #9eb5bd;border-radius:20px;cursor:pointer}
.slot:before{content:attr(data-number);position:absolute;left:9px;top:6px;font-size:18px;opacity:.65}
.slot.filled{border-color:transparent;background:transparent;outline:none}
.slot.filled:before{display:none}
.slot .gift{position:absolute;left:50%;bottom:6px;transform:translateX(-50%)}




#sentence{position:absolute;left:378px;top:505px;width:856px;min-height:43px;text-align:center;font-size:25px;font-weight:bold}
.pool{position:absolute;left:378px;top:561px;width:856px;height:143px;display:flex;align-items:center;justify-content:space-evenly;background:#ffffff59;border:2px solid #ffffffa0;border-radius:27px}
.gift{--c:#e05d69;position:relative;display:block;width:132px;height:132px;padding:0;border:0;background:none;touch-action:none;user-select:none;transition:filter .15s}
.gift:hover{filter:brightness(1.06)}
.gift.selected{outline:4px solid #244a99;outline-offset:2px;border-radius:16px}
.gift.used{visibility:hidden}
.gift-image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;user-select:none;pointer-events:none}
.gift-base{clip-path:inset(51% 0 0 0);z-index:3}
.gift-top{clip-path:inset(0 0 49% 0);z-index:4;transform-origin:50% 51%;transition:transform .5s ease,opacity .4s ease}
.gift-mouth{position:absolute;left:12.5%;right:12.5%;top:48%;height:8%;border:2px solid var(--c);border-radius:50%;background:#80502c;opacity:0;transition:opacity .25s;z-index:1;pointer-events:none}
.prize{position:absolute;left:50%;top:-41px;width:144px;height:104px;margin-left:-72px;overflow:hidden;z-index:2;opacity:0;transform:translateY(38px) scale(.7);transition:transform .5s ease,opacity .35s ease;pointer-events:none}
.prize img{position:absolute;max-width:none;display:block;pointer-events:none;user-select:none}
.gift.open .gift-top{animation:none;transform:translateY(-66px) rotate(-11deg);opacity:0}
.gift.open .gift-mouth{opacity:1}
.gift.open .prize{opacity:1;transform:translateY(0) scale(1)}
.gift.ready .gift-top{animation:gift-wiggle 2s infinite}
@keyframes gift-wiggle{0%,75%,100%{rotate:0deg}82%{rotate:1.5deg}91%{rotate:-1.5deg}}
.ghost{position:fixed!important;z-index:1000;pointer-events:none;transform:none!important;filter:drop-shadow(0 10px 10px #0003)}
.bottom-controls{position:absolute;left:45px;top:587px;width:280px;display:grid;gap:17px}
#next,#playAgain{background:#ffe4a1;border-color:#d4b56c;box-shadow:0 4px #d4b56c;font-size:23px}
[hidden]{display:none!important}
.overlay{position:absolute;inset:0;background:#243b6670;z-index:30;display:grid;place-items:center}
.dialog{background:#fffef8;width:710px;border:5px solid white;border-radius:32px;padding:33px 38px;box-shadow:0 15px 45px #0003;font-size:24px;line-height:1.45}
.dialog h2{margin:0 0 16px;font-size:32px}
.dialog p{margin:14px 0}
.dialog .control{display:block;margin:24px auto 0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<link rel="preload" as="image" href="assets/roma-v1.webp">
<link rel="preload" as="image" href="assets/gift-red-v1.webp">
<link rel="preload" as="image" href="assets/gift-blue-v1.webp">
<link rel="preload" as="image" href="assets/gift-green-v1.webp">
<link rel="preload" as="image" href="assets/gift-yellow-v1.webp">
</head>
<body>
<main id="frame" aria-label="Игра Подарки для друзей">
<div id="game">
  <header class="header">
    <h1>🎁 Подарки для друзей</h1>
    <div id="levels" class="levels" aria-label="Уровни"></div>
    <button id="helpButton" class="control">Как играть</button>
    <button id="restartButton" class="control">Сначала</button>
  </header>
  <section class="guest" aria-label="Персонаж и образец">
    <div id="child" class="child" aria-hidden="true"></div>
    <div id="guestName" class="guest-name"></div>
  </section>
  <div class="table">
    <div id="slots" class="slots"></div>
    <img class="table-art" src="assets/festive-table-v1.webp" alt="" aria-hidden="true" draggable="false">
  </div>
  <div id="sentence" aria-live="polite"></div>
  <div id="pool" class="pool" aria-label="Подарки на полянке"></div>
  <div class="bottom-controls">
    <div id="instruction" role="status" aria-live="polite"></div>
    <button id="next" class="control" hidden>Дальше ➜</button>
    <button id="playAgain" class="control" hidden>Играть снова</button>
  </div>
  <div id="help" class="overlay" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">Как играть</h2>
      <p>Посмотри на карточку у ребёнка. Расставь подарки на столе в таком же порядке — слева направо.</p>
      <p>Перетаскивай коробки или нажми на подарок, а затем на место на столе.</p>
      <p>Когда соберёшь все четыре подарка, нажимай на коробки и называй сюрпризы целым предложением.</p>
      <button id="closeHelp" class="control">Понятно!</button>
    </section>
  </div>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const colors = {
  red:{hex:'#eb5864',name:'красный',in:'красной'},
  blue:{hex:'#4b8ce3',name:'синий',in:'синей'},
  green:{hex:'#65b963',name:'зелёный',in:'зелёной'},
  yellow:{hex:'#f4d348',name:'жёлтый',in:'жёлтой'}
};
const levels = [
  {name:'Рома',owner:'Ромы',face:'👦🏻',order:['red','blue','green','yellow'],prizes:[['баран','ram'],['барабан','drum'],['робот','robot'],['ракета','rocket']]},
  {name:'Ира',owner:'Иры',face:'👧🏼',order:['yellow','green','red','blue'],prizes:[['рыба','fish'],['жираф','giraffe'],['гитара','guitar'],['трактор','tractor']]},
  {name:'Артём',owner:'Артёма',face:'👦🏽',order:['green','red','yellow','blue'],prizes:[['тигр','tiger'],['корова','cow'],['грузовик','truck'],['карандаш','pencil']]},
  {name:'Рая',owner:'Раи',face:'👧🏻',order:['blue','yellow','green','red'],prizes:[['краб','crab'],['ворона','crow'],['помидор','tomato'],['гармошка','accordion']]},
  {name:'Марк',owner:'Марка',face:'👦🏼',order:['red','green','blue','yellow'],prizes:[['крокодил','crocodile'],['динозавр','dinosaur'],['паровоз','locomotive'],['вертолёт','helicopter']]}
];
const toyLayout={"ram":[117.281,117.281,13.032,-6.921],"drum":[132.268,132.268,3.335,-14.978],"robot":[111.849,111.849,14.871,-4.549],"rocket":[118.452,118.452,12.727,-7.935],"fish":[153.974,153.974,-6.338,-24.803],"giraffe":[110.992,110.992,14.158,-2.744],"guitar":[113.208,113.208,14.583,-5.326],"tractor":[131.733,131.733,4.663,-19.119],"tiger":[122.456,122.456,11.26,-9.961],"cow":[123.15,123.15,9.443,-10.508],"truck":[149.217,149.217,-4.096,-25.822],"pencil":[128.236,128.236,5.019,-11.351],"crab":[133.35,133.35,4.9,-16.057],"crow":[113.11,113.11,17.79,-4.871],"tomato":[140.686,140.686,1.433,-19.297],"accordion":[148.256,148.256,-2.601,-21.793],"crocodile":[152.128,152.128,-5.944,-25.564],"dinosaur":[142.376,142.376,0.472,-23.956],"locomotive":[124.443,124.443,7.695,-10.221],"helicopter":[135.286,135.286,4.141,-18.448]};
const toyCache=new Map();
function getToyImage(key){
  if(!toyCache.has(key)){const image=new Image();image.src='assets/toys/'+key+'-v1.webp';toyCache.set(key,image);}
  return toyCache.get(key);
}
const characterImages=["roma","ira","artyom","raya","mark"];
let levelIndex=0, placed=[null,null,null,null], opened=[false,false,false,false];
let selected=null, drag=null, ghost=null, messageTimer=null;
function shuffle(list){
  const a=[...list];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function resize(){
  const scale=Math.min(innerWidth/1280,innerHeight/720,1.6);
  $('frame').style.width=1280*scale+'px';
  $('frame').style.height=720*scale+'px';
  $('game').style.transform=`scale(${scale})`;
}
function allPlaced(){return placed.every(Boolean)}
function instruction(){
  const complete=allPlaced();
  $('instruction').hidden=complete;
  $('instruction').textContent=complete?'':'Расставь подарки по образцу.';
}
function say(text){
  clearTimeout(messageTimer);$('instruction').hidden=false;$('instruction').textContent=text;
  messageTimer=setTimeout(instruction,2200);
}
function gift(color,slot=null){
  const b=document.createElement('button');
  b.type='button';b.className='gift';b.style.setProperty('--c',colors[color].hex);
  b.dataset.color=color;
  b.setAttribute('aria-label',colors[color].name+' подарок');
  const imageSrc='assets/gift-'+color+'-v1.webp';
  b.innerHTML='<span class="gift-mouth"></span><span class="prize"></span><img class="gift-image gift-base" src="'+imageSrc+'" alt="" draggable="false"><img class="gift-image gift-top" src="'+imageSrc+'" alt="" draggable="false">';
  if(slot===null){
    b.addEventListener('pointerdown',e=>startDrag(e,color,b));
    b.addEventListener('click',e=>{if(e.detail===0)select(color)});
  }else{
    b.addEventListener('click',e=>{e.stopPropagation();openGift(slot)});
  }
  return b;
}
function select(color){
  if(placed.includes(color))return;
  selected=selected===color?null:color;
  document.querySelectorAll('#pool .gift').forEach(b=>{
    b.classList.toggle('selected',b.dataset.color===selected);
    b.setAttribute('aria-pressed',String(b.dataset.color===selected));
  });
}
function startDrag(e,color,button){
  if(e.button!==0||placed.includes(color)||!$('help').hidden)return;
  e.preventDefault();
  drag={id:e.pointerId,color,button,x:e.clientX,y:e.clientY,half:button.offsetWidth/2,moved:false};
  button.setPointerCapture(e.pointerId);
}
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true;ghost=drag.button.cloneNode(true);
    ghost.classList.remove('selected');ghost.classList.add('ghost');
    ghost.setAttribute('aria-hidden','true');ghost.tabIndex=-1;
    const scale=$('frame').getBoundingClientRect().width/1280;
    drag.scale=scale;ghost.style.transformOrigin='top left';
    ghost.style.setProperty('transform',`scale(${scale})`,'important');
    document.body.appendChild(ghost);
  }
  if(ghost){ghost.style.left=e.clientX-drag.half*drag.scale+'px';ghost.style.top=e.clientY-drag.half*drag.scale+'px'}
});
window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;cancelDrag();
  if(d.moved){
    const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');
    if(target)place(d.color,Number(target.dataset.slot));
  }else select(d.color);
});
function cancelDrag(){ghost?.remove();ghost=null;drag=null}
window.addEventListener('pointercancel',cancelDrag);
window.addEventListener('blur',cancelDrag);
function place(color,index){
  if(placed.includes(color)||placed[index]||allPlaced())return;
  if(levels[levelIndex].order[index]!==color){say('Посмотри на карточку: здесь нужен другой цвет.');return}
  placed[index]=color;selected=null;
  const slot=$('slots').children[index];slot.classList.add('filled');
  slot.appendChild(gift(color,index));slot.setAttribute('aria-label','Место '+(index+1)+', '+colors[color].name+' подарок');
  document.querySelectorAll('#pool .gift').forEach(b=>{
    b.classList.remove('selected');b.setAttribute('aria-pressed','false');
    if(placed.includes(b.dataset.color)){b.classList.add('used');b.disabled=true}
  });
  clearTimeout(messageTimer);instruction();
  if(allPlaced()){
    document.querySelectorAll('#slots .gift').forEach(b=>b.classList.add('ready'));
    $('sentence').textContent='Нажми на подарок 🎁';
  }
}
function openGift(index){
  if(!allPlaced()){say('Сначала расставь все четыре подарка по образцу.');return}
  const level=levels[levelIndex], [word,toyKey]=level.prizes[index];
  opened[index]=true;
  const b=$('slots').children[index].querySelector('.gift');
  const toy=getToyImage(toyKey).cloneNode();toy.alt='';toy.draggable=false;
  const [w,h,x,y]=toyLayout[toyKey];
  Object.assign(toy.style,{width:w+'px',height:h+'px',left:x+'px',top:y+'px'});
  b.querySelector('.prize').replaceChildren(toy);b.classList.remove('ready');b.classList.add('open');
  const phrase=`У ${level.owner} в ${colors[placed[index]].in} коробке ${word}.`;
  b.setAttribute('aria-label',phrase);$('sentence').textContent=phrase;
  if(opened.every(Boolean)){
    const finished=levelIndex===levels.length-1;
    $('next').hidden=finished;
    $('playAgain').hidden=!finished;
    if(finished){
      const last=$('levels').lastElementChild;
      last.classList.remove('active');last.classList.add('done');last.textContent='✓';last.removeAttribute('aria-current');
    }
  }
}
function loadLevel(){
  clearTimeout(messageTimer);cancelDrag();selected=null;
  placed=[null,null,null,null];opened=[false,false,false,false];
  const level=levels[levelIndex];
  level.prizes.forEach(([,key])=>getToyImage(key));
  $('playAgain').hidden=true;$('next').hidden=true;$('sentence').textContent='';
  const portrait=document.createElement('img');
  portrait.src='assets/'+characterImages[levelIndex]+'-v1.webp';portrait.alt='';portrait.draggable=false;
  $('child').replaceChildren(portrait);$('guestName').textContent=level.name;
  document.querySelector('.guest').setAttribute('aria-label',level.name+'. Образец слева направо: '+level.order.map(c=>colors[c].name).join(', '));
  $('levels').innerHTML=levels.map((_,i)=>`<span class="dot ${i===levelIndex?'active':i<levelIndex?'done':''}" ${i===levelIndex?'aria-current="step"':''}>${i<levelIndex?'✓':i+1}</span>`).join('');
  $('slots').replaceChildren();$('pool').replaceChildren();
  for(let i=0;i<4;i++){
    const slot=document.createElement('div');slot.className='slot';slot.dataset.slot=i;slot.dataset.number=i+1;
    slot.tabIndex=0;slot.setAttribute('role','group');slot.setAttribute('aria-label','Место '+(i+1));
    const activate=()=>{if(selected)place(selected,i);else if(!placed[i])say('Выбери подарок на полянке и нажми на место на столе.')};
    slot.addEventListener('click',activate);
    slot.addEventListener('keydown',e=>{if(e.target===slot&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate()}});
    $('slots').appendChild(slot);
  }
  let poolOrder=shuffle(Object.keys(colors));
  if(poolOrder.every((c,i)=>c===level.order[i]))poolOrder.push(poolOrder.shift());
  poolOrder.forEach(c=>$('pool').appendChild(gift(c)));
  instruction();
}
function restart(){levelIndex=0;$('help').hidden=true;loadLevel()}
$('next').onclick=()=>{
  if(!opened.every(Boolean))return;
  if(levelIndex<levels.length-1){levelIndex++;loadLevel()}
};
$('restartButton').onclick=restart;$('playAgain').onclick=restart;
$('helpButton').onclick=()=>{cancelDrag();$('help').hidden=false;$('closeHelp').focus()};
$('closeHelp').onclick=()=>{$('help').hidden=true;$('helpButton').focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('help').hidden)$('closeHelp').click()});
window.addEventListener('resize',resize);
resize();loadLevel();
</script>
</body>
</html>
